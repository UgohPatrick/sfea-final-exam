<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        <label for="phone-number">Age:</label>
        <input type="number" id="phone-number" name="phone-number"><br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label  ><br><br>
        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="cs">frontend Development</option>
            <option value="it">Python Development</option>
            <option value="ee">backend Development</option>
        </select><br><br>

    </form>
    
</body>
</html>
